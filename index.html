<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Speech Assistant</title>
<style>
:root{--bg:#f4f5fb;--card:#ffffff;--text:#1b1d2e;--muted:#6a6f87;--line:#e3e5f0;--a:#6c5ce7;--b:#00b8d9;--rec:#ef4444;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f1c;--card:#161933;--text:#eef0ff;--muted:#9aa0c3;--line:#262a4d;--a:#8b7dff;--b:#22d3ee}}
:root[data-theme="dark"]{--bg:#0d0f1c;--card:#161933;--text:#eef0ff;--muted:#9aa0c3;--line:#262a4d;--a:#8b7dff;--b:#22d3ee}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 40% at 20% 20%,color-mix(in srgb,var(--a) 28%,transparent),transparent),radial-gradient(40% 40% at 80% 70%,color-mix(in srgb,var(--b) 25%,transparent),transparent);animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,-3%) scale(1.08)}}
.wrap{max-width:1050px;margin:0 auto;padding:22px 16px 40px}
h1{margin:0;font-size:clamp(1.5rem,4vw,2.2rem);background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;animation:fade .8s both}
.sub{color:var(--muted);margin:6px 0 22px;animation:fade .8s .15s both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 10px 30px rgba(60,50,150,.08);animation:fade .7s .25s both}
.card h2{margin:0 0 12px;font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cam{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:4/3;background:#000;display:grid;place-items:center}
.cam::after{content:"";position:absolute;inset:0;border-radius:16px;border:3px solid transparent;pointer-events:none;transition:.3s}
.cam.live::after{border-color:var(--rec);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.55)}100%{box-shadow:0 0 0 18px rgba(239,68,68,0)}}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.ph{position:absolute;color:#cfd3f5;text-align:center;padding:16px;font-size:.95rem}
.badge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.55);color:#fff;padding:4px 10px;border-radius:99px;font-size:.78rem;display:none}
.cam.live .badge{display:block}
.bars{display:flex;gap:4px;align-items:flex-end;height:30px;justify-content:center;margin-top:14px}
.bars i{width:5px;height:6px;border-radius:3px;background:linear-gradient(var(--a),var(--b));transition:height .2s}
.bars.on i{animation:eq .9s ease-in-out infinite}
.bars i:nth-child(2n){animation-delay:.15s}.bars i:nth-child(3n){animation-delay:.3s}.bars i:nth-child(5n){animation-delay:.45s}
@keyframes eq{0%,100%{height:6px}50%{height:28px}}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
button,select{font:inherit;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:10px 14px;cursor:pointer;transition:transform .15s,box-shadow .15s}
button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 16px rgba(108,92,231,.25)}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:linear-gradient(90deg,var(--a),var(--b));color:#fff;border:0;font-weight:600}
.mic.rec{background:var(--rec);color:#fff;border:0;animation:pulse 1.4s infinite}
.box{min-height:130px;border:1px dashed var(--line);border-radius:14px;padding:14px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word;background:var(--bg)}
.box.out{border-style:solid;border-color:color-mix(in srgb,var(--a) 50%,var(--line));font-size:1.05rem}
.interim{color:var(--muted)}
.caret::after{content:"▍";color:var(--a);animation:blink .8s infinite}
@keyframes blink{50%{opacity:0}}
.full{grid-column:1/-1}
.msg{color:var(--muted);font-size:.85rem;margin-top:10px}
.err{color:var(--rec)}
</style>
</head>
<body>
<div class="wrap">
  <h1>✨ AI Speech Assistant</h1>
  <p class="sub">Speak naturally in English. Your assistant rewrites it into polished, formal language.</p>
  <div class="grid">
    <section class="card">
      <h2>Camera</h2>
      <div class="cam" id="cam">
        <video id="video" autoplay playsinline muted></video>
        <div class="ph" id="ph">📷 Press “Start Camera” to see yourself</div>
        <div class="badge">● LIVE</div>
      </div>
      <div class="bars" id="bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="row">
        <button id="camBtn">📷 Start Camera</button>
        <button id="micBtn" class="mic">🎤 Start Speaking</button>
        <select id="lang" title="Accent">
          <option value="en-IN">English (India)</option>
          <option value="en-US">English (US)</option>
          <option value="en-GB">English (UK)</option>
        </select>
      </div>
      <div class="msg" id="status">Tip: use Google Chrome or Edge for speech recognition.</div>
    </section>

    <section class="card">
      <h2>What you said</h2>
      <div class="box" id="raw" contenteditable="true" spellcheck="true"></div>
      <div class="row">
        <select id="tone">
          <option>Formal</option>
          <option>Professional</option>
          <option>Academic</option>
          <option>Persuasive</option>
        </select>
        <button id="polishBtn" class="primary">✨ Make it Beautiful</button>
        <button id="clearBtn">Clear</button>
      </div>
    </section>

    <section class="card full">
      <h2>Polished version</h2>
      <div class="box out" id="out">Your refined text will appear here…</div>
      <div class="row">
        <button id="copyBtn" disabled>📋 Copy</button>
        <button id="speakBtn" disabled>🔊 Listen</button>
        <button id="dlBtn" disabled>⬇ Save as .txt</button>
      </div>
    </section>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const raw = $('raw'), out = $('out'), status = $('status');
let stream = null, rec = null, listening = false, finalText = '', sampleFn = null, ctl = null;

function say(msg, isErr){ status.textContent = msg; status.className = 'msg' + (isErr ? ' err' : ''); }

/* ---------- Camera ---------- */
$('camBtn').onclick = async () => {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; $('video').srcObject = null;
    $('cam').classList.remove('live'); $('ph').style.display = ''; $('camBtn').textContent = '📷 Start Camera'; return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
    $('video').srcObject = stream; $('ph').style.display = 'none';
    $('cam').classList.add('live'); $('camBtn').textContent = '⏹ Stop Camera'; say('Camera is on.');
  } catch (e) {
    $('ph').textContent = '⚠️ Camera unavailable. Please allow permission or open this page in its own tab.';
    say('Camera error: ' + (e.message || e.name), true);
  }
};

/* ---------- Speech recognition ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function setListening(on){
  listening = on; $('micBtn').classList.toggle('rec', on);
  $('micBtn').textContent = on ? '⏹ Stop Speaking' : '🎤 Start Speaking';
  $('bars').classList.toggle('on', on);
}
$('micBtn').onclick = () => {
  if (!SR) { say('Speech recognition is not supported in this browser. Type your text instead, or use Chrome/Edge.', true); return; }
  if (listening) { rec && rec.stop(); return; }
  rec = new SR(); rec.lang = $('lang').value; rec.continuous = true; rec.interimResults = true;
  finalText = raw.innerText.trim() ? raw.innerText.trim() + ' ' : '';
  rec.onstart = () => { setListening(true); say('Listening… speak now.'); };
  rec.onresult = e => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalText += t + ' '; else interim += t;
    }
    raw.innerHTML = '';
    raw.append(document.createTextNode(finalText));
    const s = document.createElement('span'); s.className = 'interim'; s.textContent = interim; raw.append(s);
  };
  rec.onerror = e => say('Mic error: ' + e.error, true);
  rec.onend = () => { setListening(false); raw.textContent = finalText.trim(); say('Stopped. Press “Make it Beautiful”.');
    if (finalText.trim().length > 3) polish(); };
  try { rec.start(); } catch (e) { say(e.message, true); }
};

/* ---------- AI polishing (Claude via the page's sample capability) ---------- */
async function getSample(){
  if (sampleFn) return sampleFn;
  try { sampleFn = await claude.use('sample'); } catch (e) { sampleFn = null; }
  return sampleFn;
}
async function polish(){
  const text = raw.innerText.trim();
  if (!text) { say('Please speak or type something first.', true); return; }
  const sample = await getSample();
  if (!sample) { say('The AI assistant is not available in this view. Open the published artifact in claude.ai.', true); return; }
  if (ctl) ctl.abort(); ctl = new AbortController();
  $('polishBtn').disabled = true; out.classList.add('caret'); out.textContent = '';
  say('Polishing your words…');
  const prompt = `You are an expert English speech editor. Rewrite the spoken text below in a ${$('tone').value.toLowerCase()} tone.
Rules: fix grammar and filler words (um, uh, like), keep the speaker's meaning and facts, use elegant but clear vocabulary, improve flow, and keep it first-person if the speaker used first-person. Output ONLY the rewritten text, no preface or quotes.

Spoken text:
"""${text}"""`;
  try {
    const r = await sample(prompt, { cache: false, modelTier: 'quick', signal: ctl.signal,
      onText: ({ text }) => { out.textContent = text; } });
    out.textContent = (r && r.text) || out.textContent;
    ['copyBtn','speakBtn','dlBtn'].forEach(id => $(id).disabled = false);
    say('Done ✨ Copy it, listen to it, or save it.');
  } catch (e) {
    if (e && e.code === 'not_granted') say('Permission to use the AI was declined.', true);
    else if (e && e.code === 'rate_limited') say('Too many requests, please wait a moment.', true);
    else say('Could not polish: ' + ((e && e.message) || 'unknown error'), true);
  } finally { out.classList.remove('caret'); $('polishBtn').disabled = false; }
}
$('polishBtn').onclick = polish;

/* ---------- Output actions ---------- */
$('copyBtn').onclick = async () => {
  try { await navigator.clipboard.writeText(out.textContent); say('Copied to clipboard ✅'); }
  catch { const r = document.createRange(); r.selectNodeContents(out); const s = getSelection(); s.removeAllRanges(); s.addRange(r); say('Text selected. Press Ctrl+C to copy.'); }
};
$('speakBtn').onclick = () => {
  if (!('speechSynthesis' in window)) return say('Text-to-speech not supported here.', true);
  speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(out.textContent); u.lang = $('lang').value; u.rate = .95; speechSynthesis.speak(u);
};
$('dlBtn').onclick = async () => {
  const text = out.textContent;
  try { const d = await claude.use('downloads'); if (d) { await d.save({ filename: 'polished-speech.txt', data: text }); return; } } catch (e) {}
  say('Saving is not available here. Please use Copy instead.', true);
};
$('clearBtn').onclick = () => { raw.textContent = ''; finalText = ''; out.textContent = 'Your refined text will appear here…';
  ['copyBtn','speakBtn','dlBtn'].forEach(id => $(id).disabled = true); speechSynthesis && speechSynthesis.cancel(); say('Cleared.'); };
</script>
</body>
</html>
